<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Final Countdown</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;

            font-family: Arial, sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    #312e81,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    #0e7490,
                    transparent 30%
                ),
                #080b14;
        }

        .container {
            width: 100%;
            max-width: 750px;

            margin: 0 auto;
            padding: 30px 15px;

            text-align: center;
        }

        /* =========================
           RUBRIK
           ========================= */

        header {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            margin-bottom: 40px;
        }

        h1 {
            margin: 0;

            font-size: clamp(
                2rem,
                7vw,
                4rem
            );

            line-height: 1.1;

            text-align: center;

            background:
                linear-gradient(
                    90deg,
                    #60a5fa,
                    #a78bfa,
                    #22d3ee
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            margin: 12px 0 0;

            color: #9ca3af;

            font-size: 1rem;

            text-align: center;
        }

        /* =========================
           HÄNDELSER
           ========================= */

        .countdowns {
            width: 100%;

            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 20px;
        }

        /* =========================
           KORT
           ========================= */

        .card {
            position: relative;
            overflow: hidden;

            width: 100%;
            max-width: 650px;

            padding: 25px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid
                rgba(255,255,255,0.12);

            border-radius: 20px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.25);

            text-align: center;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background: var(--color);

            filter: blur(80px);

            opacity: 0.25;

            left: 50%;
            top: -100px;

            transform: translateX(-50%);

            pointer-events: none;
        }

        /* =========================
           INNEHÅLL
           ========================= */

        .top {
            position: relative;

            width: 100%;

            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 8px;

            text-align: center;
        }

        .icon {
            font-size: 2.5rem;

            line-height: 1;

            text-align: center;
        }

        .title {
            font-size: 1.4rem;

            font-weight: bold;

            text-align: center;
        }

        .date {
            color: #9ca3af;

            font-size: 0.9rem;

            text-align: center;
        }

        /* =========================
           TIMER
           ========================= */

        .timer {
            position: relative;

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 8px;

            margin-top: 25px;
        }

        .unit {
            min-width: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            background:
                rgba(0,0,0,0.25);

            border-radius: 12px;

            padding: 12px 3px;
        }

        .number {
            display: block;

            width: 100%;

            font-size: clamp(
                1.4rem,
                5vw,
                2.4rem
            );

            line-height: 1;

            font-weight: bold;

            color: var(--color);

            font-variant-numeric:
                tabular-nums;

            text-align: center;
        }

        .label {
            display: block;

            width: 100%;

            margin-top: 6px;

            color: #8f96a3;

            font-size: 0.6rem;

            text-transform: uppercase;

            text-align: center;
        }

        .finished {
            width: 100%;

            text-align: center;

            color: #4ade80;

            font-size: 1.2rem;

            font-weight: bold;

            padding: 20px;
        }

        /* =========================
           FOOTER
           ========================= */

        footer {
            width: 100%;

            margin-top: 35px;

            color: #6b7280;

            font-size: 0.8rem;

            text-align: center;
        }

        /* =========================
           MOBIL
           ========================= */

        @media (max-width: 600px) {

            .container {
                padding:
                    25px 12px;
            }

            .card {
                padding:
                    20px 14px;
            }

            .timer {
                gap: 5px;
            }

            .number {
                font-size: 1.5rem;
            }

        }

        @media (max-width: 380px) {

            .card {
                padding:
                    18px 10px;
            }

            .timer {
                gap: 4px;
            }

            .unit {
                padding:
                    9px 2px;
            }

            .number {
                font-size: 1.25rem;
            }

            .label {
                font-size: 0.5rem;
            }

        }
    </style>
</head>


<body>

<div class="container">

    <header>
        <h1>Final Countdown</h1>

        <p>
            Håll koll på det viktigast
        </p>
    </header>


    <!-- HÄNDELSERNA VISAS UNDER VARANDRA -->

    <div
        class="countdowns"
        id="countdowns">
    </div>


    <footer>
        Nedräkningarna uppdateras automatiskt varje sekund.
    </footer>

</div>


<script>

/* =====================================================
   ⭐ ÄNDRA BARA HÄR ⭐

   Närmaste datum visas automatiskt först.

   ikon = emoji som visas ovanför händelsen
   ===================================================== */


const nedrakningar = [

    {
        namn: "CPH Half",
        datum: "2026-09-20T09:30:00",
        ikon: "🏃‍♂️",
        farg: "#60a5fa"
    },

    {
        namn: "Resan",
        datum: "2026-11-18T12:00:00",
        ikon: "✈️",
        farg: "#22d3ee"
    },

    {
        namn: "Lidingöloppet",
        datum: "2026-09-26T12:30:00",
        ikon: "🏃‍♂️",
        farg: "#f472b6"
    },

    {
        namn: "Semester",
        datum: "2027-07-01T00:00:00",
        ikon: "🏖️",
        farg: "#facc15"
    },

    {
        namn: "Julafton",
        datum: "2027-12-24T00:00:00",
        ikon: "🎄",
        farg: "#4ade80"
    }

];


/* =====================================================
   SORTERA EFTER DATUM
   NÄRMASTE HÄNDELSEN FÖRST
   ===================================================== */

nedrakningar.sort(
    (a, b) =>
        new Date(a.datum) -
        new Date(b.datum)
);


/* =====================================================
   FORMATERA DATUM
   ===================================================== */

function formatDate(datum) {

    return new Date(datum).toLocaleDateString(
        "sv-SE",
        {
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );

}


/* =====================================================
   SKAPA HÄNDELSER
   ===================================================== */

function skapaKort() {

    const container =
        document.getElementById(
            "countdowns"
        );

    container.innerHTML = "";


    nedrakningar.forEach(
        (event, index) => {

            const card =
                document.createElement("div");

            card.className = "card";

            card.style.setProperty(
                "--color",
                event.farg
            );


            card.innerHTML = `

                <div class="top">

                    <div class="icon">
                        ${event.ikon}
                    </div>

                    <div class="title">
                        ${event.namn}
                    </div>

                    <div class="date">
                        ${formatDate(event.datum)}
                    </div>

                </div>


                <div
                    class="timer"
                    id="timer-${index}">
                </div>

            `;


            container.appendChild(card);

        }
    );

}


/* =====================================================
   UPPDATERA NEDRÄKNING
   ===================================================== */

function uppdateraNedrakningar() {

    const nu = new Date();


    nedrakningar.forEach(
        (event, index) => {

            const mal =
                new Date(event.datum);

            const skillnad =
                mal - nu;


            const timer =
                document.getElementById(
                    `timer-${index}`
                );


            if (!timer) return;


            if (skillnad <= 0) {

                timer.innerHTML = `
                    <div class="finished">
                        🎉 Det har hänt!
                    </div>
                `;

                return;
            }


            const dagar =
                Math.floor(
                    skillnad /
                    (1000 * 60 * 60 * 24)
                );


            const timmar =
                Math.floor(
                    (skillnad /
                    (1000 * 60 * 60)) % 24
                );


            const minuter =
                Math.floor(
                    (skillnad /
                    (1000 * 60)) % 60
                );


            const sekunder =
                Math.floor(
                    (skillnad / 1000) % 60
                );


            timer.innerHTML = `

                <div class="unit">

                    <span class="number">
                        ${dagar}
                    </span>

                    <span class="label">
                        Dagar
                    </span>

                </div>


                <div class="unit">

                    <span class="number">
                        ${String(timmar)
                            .padStart(2, "0")}
                    </span>

                    <span class="label">
                        Timmar
                    </span>

                </div>


                <div class="unit">

                    <span class="number">
                        ${String(minuter)
                            .padStart(2, "0")}
                    </span>

                    <span class="label">
                        Minuter
                    </span>

                </div>


                <div class="unit">

                    <span class="number">
                        ${String(sekunder)
                            .padStart(2, "0")}
                    </span>

                    <span class="label">
                        Sekunder
                    </span>

                </div>

            `;

        }
    );

}


/* =====================================================
   START
   ===================================================== */

skapaKort();

uppdateraNedrakningar();


setInterval(
    uppdateraNedrakningar,
    1000
);

</script>

</body>
</html>
